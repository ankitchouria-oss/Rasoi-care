name: Build Android APKs

# Builds release APKs for all six Flutter apps in this repo. GitHub-hosted
# runners have unrestricted network access (and a preinstalled Android SDK),
# which some Claude Code sessions in this environment do not, so this is the
# reliable way to get a fresh APK for each app.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - careplus_flutter
          - careplus_partner
          - careplus_admin
          - rasoi_web_customer
          - rasoi_web_partner
          - rasoi_web_admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: flutter build apk --release
        working-directory: ${{ matrix.app }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
