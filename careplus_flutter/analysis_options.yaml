include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Scaffold ships with some intentionally-unused demo hooks; keep these as
    # info rather than build-blocking while you wire the real backend.
    unused_element: info
    unused_local_variable: info

linter:
  rules:
    prefer_const_constructors: false
    use_build_context_synchronously: false
