<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RasoiCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181B; --ink-soft:#4B4E4F;
    --paper:#FBF9F5; --card:#FFFFFF; --line:#E4DECF;
    --copper:#B4793A; --copper-deep:#8C5A24; --copper-tint:#F3E4CF;
    --display:'Instrument Serif', serif; --body:'Manrope', sans-serif; --mono:'JetBrains Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ font-family:var(--body); color:var(--ink); background:var(--paper); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  a{ text-decoration:none; color:inherit; }
  .wrap{ max-width:760px; width:100%; }
  .brand{ display:flex; align-items:center; gap:9px; font-family:var(--display); font-size:26px; margin-bottom:8px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--copper); }
  .sub{ font-size:14px; color:var(--ink-soft); margin-bottom:32px; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .card{ background:var(--card); border:1.4px solid var(--line); border-radius:16px; padding:22px 20px; display:block; transition:border-color .15s, transform .15s; }
  .card:hover{ border-color:var(--copper); transform:translateY(-2px); }
  .card .em{ font-size:26px; margin-bottom:10px; display:block; }
  .card h2{ font-family:var(--display); font-size:19px; font-weight:400; margin-bottom:4px; }
  .card p{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .card .go{ font-family:var(--mono); font-size:11px; font-weight:700; color:var(--copper-deep); margin-top:14px; }
  @media (max-width:640px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>RasoiCare</div>
  <p class="sub">Three separate apps, one shared backend. Pick one.</p>
  <div class="grid">
    <a class="card" href="/customer">
      <span class="em">📱</span>
      <h2>Customer</h2>
      <p>Book services, track live status, rate completed jobs.</p>
      <div class="go">Open →</div>
    </a>
    <a class="card" href="/technician">
      <span class="em">🔧</span>
      <h2>Technician</h2>
      <p>Accept jobs, advance status, resolve complaints.</p>
      <div class="go">Open →</div>
    </a>
    <a class="card" href="/admin">
      <span class="em">🖥️</span>
      <h2>Admin</h2>
      <p>KPIs, all bookings, complaint resolution, technician roster.</p>
      <div class="go">Open →</div>
    </a>
  </div>
</div>
</body>
</html>
