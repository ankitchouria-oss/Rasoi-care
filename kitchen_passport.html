<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Passport — Rasoi Care</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b16;--muted:#6b665c;--line:#e6e1d6;--brand:#b4451f;--brand2:#7a2e14;
--g:#1f8a4c;--b:#2667b8;--y:#c98a00;--o:#d9630b;--r:#c62828;--chip:#f1ede4}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}header small{opacity:.85}
header button{background:rgba(255,255,255,.15);color:#fff;border:0}
main{max-width:1100px;margin:0 auto;padding:16px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav.tabs button{background:var(--chip);border:1px solid var(--line);color:var(--ink)}
nav.tabs button.on{background:var(--ink);color:#fff}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--brand)}button.sm{padding:4px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:30px;
 background:conic-gradient(var(--c) calc(var(--p)*1%),#ece7dc 0);position:relative}
.ring::after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}.ring span{position:relative;z-index:1}
.ring span small{font-size:13px;color:var(--muted);font-weight:500}
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin-top:10px}
.ind div{background:var(--chip);border-radius:8px;padding:6px 8px;min-width:0}
.ind b{display:block;font-size:10px;letter-spacing:.06em;color:var(--muted)}
.ind span{font-weight:600;font-size:13px;display:block;overflow-wrap:anywhere}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;background:var(--muted)}
.EXCELLENT,.NORMAL,.NOT_DUE,.MONITOR_P{background:var(--g)}.HEALTHY{background:#3a9d5d}.MONITOR{background:var(--y)}
.ATTENTION_REQUIRED{background:var(--o)}.CRITICAL,.EMERGENCY,.OVERDUE,.DUE{background:var(--r)}
.APPROACHING{background:var(--b)}.DUE_SOON,.HIGH{background:var(--o)}.MEDIUM{background:var(--y)}.LOW{background:var(--b)}.PREVENTIVE{background:#5a7d9a}
.c-EXCELLENT,.c-HEALTHY{--c:var(--g)}.c-MONITOR{--c:var(--y)}.c-ATTENTION_REQUIRED{--c:var(--o)}.c-CRITICAL{--c:var(--r)}
.warn{background:#fdecea;border:2px solid var(--r);color:#7f1414;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.warn b{display:block;font-size:15px;margin-bottom:2px}
.attn{background:#fff4e5;border:1px solid var(--o);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.apl{cursor:pointer;transition:box-shadow .15s}.apl:hover{box-shadow:0 3px 14px rgba(0,0,0,.08)}
.apl h3{margin:0;font-size:16px}.apl .sc{font-size:26px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:8px;background:#ece7dc;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(20,18,14,.5);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 12px;z-index:20}
.modal>.card{max-width:820px;width:100%}
.tl{border-left:3px solid var(--line);margin-left:8px;padding-left:16px}
.tl .it{position:relative;margin-bottom:14px;cursor:pointer}.tl .it::before{content:"";position:absolute;left:-23px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--brand)}
.chg{font-weight:700}.up{color:var(--g)}.down{color:var(--r)}
.photos img{width:120px;height:90px;object-fit:cover;border-radius:8px;margin:4px;border:1px solid var(--line)}
.err{color:var(--r);font-size:13px}.ok{color:var(--g)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}.steps span{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--chip)}
.steps span.on{background:var(--ink);color:#fff}.steps span.done{background:var(--g);color:#fff}
.sect{font-size:12px;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:14px 0 6px;text-transform:uppercase}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:6px 12px 12px}legend{font-size:13px;font-weight:600;padding:0 4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 12px}
.hide{display:none!important}
.qr{background:#fff;padding:10px;display:inline-block;border-radius:10px;border:1px solid var(--line)}
@media (max-width:560px){.ring{width:96px;height:96px;font-size:24px}}
@media print{header,nav,button{display:none!important}.modal{position:static;background:none;padding:0}body{background:#fff}}
</style>
</head>
<body>
<header><h1>Kitchen Passport <small>by Rasoi Care</small></h1><span id="who" class="small"></span><button id="logout" class="sm hide">Sign out</button></header>
<main id="app"></main>
<div id="modal" class="modal hide"><div class="card" id="mbody"></div></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nice = v => v == null ? "—" : String(v).replace(/_/g, " ").toLowerCase().replace(/^\w/, c => c.toUpperCase());
const fmtDate = d => d ? new Date(d + (d.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-IN", {day: "numeric", month: "long", year: "numeric"}) : "—";
const S = { token: null, role: null, name: "", cfg: null, tab: null };
try { Object.assign(S, JSON.parse(sessionStorage.getItem("kp_session") || "{}")); } catch (e) {}
const save = () => { try { sessionStorage.setItem("kp_session", JSON.stringify({token: S.token, role: S.role, name: S.name})); } catch (e) {} };

async function api(path, opts = {}) {
  const headers = {"Content-Type": "application/json"};
  if (S.token) headers.Authorization = "Bearer " + S.token;
  const r = await fetch(path, {method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined});
  if (r.status === 401 && S.token) { logout(); throw new Error("Session expired"); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.blob();
  if (!r.ok) { const e = new Error(data.error || r.statusText); e.fields = data.fields; e.status = r.status; throw e; }
  return data;
}
function badge(v, extra = "") { return v ? `<span class="badge ${esc(v)}${extra}">${esc(nice(v))}</span>` : `<span class="badge">—</span>`; }
function ring(score, status) {
  return `<div class="ring c-${esc(status || "")}" style="--p:${score ?? 0}"><span>${score ?? "—"}<small>/100</small></span></div>`;
}
function modal(html) { $("#mbody").innerHTML = html + `<div class="right" style="margin-top:12px"><button class="ghost" onclick="closeModal()">Close</button></div>`; $("#modal").classList.remove("hide"); window.scrollTo(0, 0); }
function closeModal() { $("#modal").classList.add("hide"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
function logout() { S.token = null; S.role = null; S.name = ""; save(); render(); }
$("#logout").onclick = logout;
async function photoURL(id) { const b = await api("/api/kp/photos/" + encodeURIComponent(id)); return URL.createObjectURL(b); }
async function fillPhotos(el, photos) {
  for (const p of photos) { try { const u = await photoURL(p.photo_id); el.insertAdjacentHTML("beforeend", `<figure style="display:inline-block;margin:0"><img src="${u}" alt="${esc(p.kind)} photo"><figcaption class="small muted">${esc(nice(p.kind))}</figcaption></figure>`); } catch (e) {} }
}

// ================================================================ login
function renderLogin() {
  $("#app").innerHTML = `
  <div class="card" style="max-width:460px;margin:30px auto">
    <h2 style="margin-top:0">Sign in</h2>
    <nav class="tabs" id="lt"><button data-r="customer" class="on">Customer</button><button data-r="technician">Technician</button><button data-r="staff">Admin</button></nav>
    <form id="lf">
      <div data-for="customer"><label>Email</label><input name="email" type="email" autocomplete="username"><label>Password</label><input name="password" type="password" autocomplete="current-password"></div>
      <div data-for="technician staff" class="hide"><label>Phone</label><input name="phone" inputmode="numeric"><label>PIN</label><input name="pin" type="password" inputmode="numeric"></div>
      <p class="err" id="le"></p><button style="width:100%">Sign in</button>
    </form>
    <p class="small muted">Demo (after <code>python -m kitchen_passport.seed</code>): customer <b>ankit@rasoicare.demo</b> / demo1234 · technician <b>9822000099</b> / 4321 · admin <b>9822000001</b> / 1234</p>
  </div>`;
  let role = "customer";
  $("#lt").onclick = e => { const b = e.target.closest("button"); if (!b) return; role = b.dataset.r;
    [...$("#lt").children].forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll("[data-for]").forEach(d => d.classList.toggle("hide", !d.dataset.for.split(" ").includes(role))); };
  $("#lf").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); $("#le").textContent = "";
    try {
      let r;
      if (role === "customer") { r = await api("/api/auth/login", {method: "POST", body: {email: f.get("email"), password: f.get("password")}}); S.name = r.user.name; }
      else if (role === "technician") { r = await api("/api/kp/tech/login", {method: "POST", body: {phone: f.get("phone"), pin: f.get("pin")}}); S.name = r.technician.name; }
      else { r = await api("/api/staff/login", {method: "POST", body: {phone: f.get("phone"), pin: f.get("pin")}}); S.name = r.staff.name + (r.staff.role === "owner" ? " (owner)" : ""); }
      S.token = r.token; S.role = role; S.tab = null; save(); render();
    } catch (err) { $("#le").textContent = err.message; }
  };
}

async function render() {
  $("#who").textContent = S.token ? `${S.name} · ${nice(S.role)}` : "";
  $("#logout").classList.toggle("hide", !S.token);
  if (!S.cfg) { try { S.cfg = await api("/api/kp/config/public"); } catch (e) {} }
  if (!S.token) return renderLogin();
  const scan = (location.hash.match(/scan=([^&]+)/) || [])[1];
  if (S.role === "customer") return customerApp();
  if (S.role === "technician") return techApp(scan ? decodeURIComponent(scan) : null);
  return adminApp();
}

// ================================================================ shared appliance views
function indicators(ind) {
  const svcBadge = ind.service.status ? `<span class="badge ${esc(ind.service.status)}">${esc(ind.service.label || nice(ind.service.status))}</span>` : "";
  return `<div class="ind">
    <div><b>HEALTH</b><span>${ind.health.score != null ? esc(ind.health.score) + "/100" : "—"}</span>${badge(ind.health.status)}</div>
    <div><b>SAFETY</b><span>${esc(ind.safety.text)}</span>${badge(ind.safety.status)}</div>
    <div><b>SERVICE</b><span>${esc(ind.service.text)}</span>${svcBadge}</div>
    <div><b>ACTION</b><span>${esc(ind.action.text)}</span>${ind.action.priority ? badge(ind.action.priority) : ""}</div></div>`;
}
function applianceCard(a) {
  const crit = a.indicators.safety.status === "CRITICAL";
  return `<div class="card apl" data-aid="${esc(a.appliance_id)}" style="${crit ? "border:2px solid var(--r)" : ""}">
    <div class="row" style="align-items:flex-start"><div><h3>${esc(a.label)}</h3><div class="small muted">${esc([a.brand, a.model].filter(Boolean).join(" ") || "")} · ${esc(a.appliance_id)}</div></div>
    <div class="right sc" style="flex:0">${a.indicators.health.score ?? "—"}</div></div>
    ${crit ? `<div class="warn" style="margin:8px 0 0"><b>⚠ SAFETY WARNING</b>${esc(a.safety_findings[0]?.customer_message || "")}</div>` : ""}
    ${indicators(a.indicators)}</div>`;
}
function bindApplianceClicks(root) {
  root.querySelectorAll("[data-aid]").forEach(el => el.onclick = () => openAppliance(el.dataset.aid));
}
async function openAppliance(aid) {
  const a = await api("/api/kp/appliances/" + encodeURIComponent(aid));
  const ai = a.ai_summary;
  const hist = a.score_history.map(h => `<tr><td>${fmtDate(h.inspected_at)}</td><td>${esc(nice(h.phase))}</td><td><b>${h.score}</b></td><td>${badge(h.safety_status)}</td><td>${badge(h.repair_priority)}</td><td><button class="sm ghost" data-ins="${esc(h.inspection_id)}">View</button></td></tr>`).join("");
  const svc = a.services.map(s => `<tr><td>${fmtDate(s.service_date)}</td><td>${esc(nice(s.service_type))}</td><td>${s.before_score ?? "—"} → ${s.after_score ?? "—"}</td><td>${badge(s.status)}</td><td><button class="sm ghost" data-svc="${esc(s.service_id)}">Open</button></td></tr>`).join("");
  modal(`<div class="hero">${ring(a.indicators.health.score, a.indicators.health.status)}<div><h2 style="margin:0">${esc(a.label)}</h2>
    <div class="muted small">${esc(a.appliance_id)} · ${esc([a.brand, a.model].filter(Boolean).join(" "))}${a.appliance_age != null ? " · " + a.appliance_age + " yrs" : ""}</div>
    <div class="small">Warranty: ${a.warranty_end ? (a.warranty_active ? "Active until " : "Expired ") + fmtDate(a.warranty_end) : "—"}${a.extended_warranty ? " (extended)" : ""}</div></div></div>
    ${a.safety_findings.filter(f => f.level === "CRITICAL").map(f => `<div class="warn"><b>⚠ SAFETY WARNING</b>${esc(f.customer_message)}</div>`).join("")}
    ${indicators(a.indicators)}
    <div class="sect">Service countdown</div>
    <div class="small">Last service: <b>${fmtDate(a.indicators.service.last_service_date)}</b> · Recommended service: <b>${fmtDate(a.indicators.service.recommended_service_date)}</b> ·
     ${a.indicators.service.days_remaining < 0 ? `<b class="down">Service overdue: ${a.indicators.service.overdue_days} days</b>` : `Days remaining: <b>${a.indicators.service.days_remaining ?? "—"}</b>`}</div>
    ${a.recommendations.length ? `<div class="sect">Recommended</div><ol>${a.recommendations.map(r => `<li>${esc(r.text)}${r.urgent ? ' <span class="badge CRITICAL">Urgent</span>' : ""}</li>`).join("")}</ol>
      <div class="small">Priority ${badge(a.indicators.action.priority)}${a.recommendations[0]?.recommended_within_days ? ` · Recommended within <b>${a.recommendations[0].recommended_within_days} days</b>` : ""}</div>` : ""}
    <div class="sect">Health insight <span class="muted">(from recorded inspections only)</span></div>
    <div class="small"><b>Observed data</b><ul>${ai.observed_data.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <b>Possible causes</b><ul>${ai.possible_causes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <b>Recommended action</b><ul>${ai.recommended_action.map(x => `<li>${esc(x)}</li>`).join("")}</ul><span class="muted">${esc(ai.disclaimer)}</span></div>
    <div class="sect">Service history</div>${svc ? `<table><tr><th>Date</th><th>Type</th><th>Score</th><th>Status</th><th></th></tr>${svc}</table>` : '<p class="muted small">No services yet.</p>'}
    <details style="margin-top:12px"><summary><b>View Full Inspection</b></summary>
      <div class="sect">Score breakdown (algorithm v${esc(a.algorithm_version ?? "—")})</div>
      <table><tr><th>Component</th><th>Weight</th><th>Condition</th><th class="right">Points</th></tr>${a.score_components.map(c => `<tr><td>${esc(c.label)}</td><td>${c.weight}</td><td><div class="bar"><i style="width:${Math.round(c.fraction * 100)}%"></i></div></td><td class="right">${c.points}</td></tr>`).join("")}</table>
      ${a.schedule ? `<div class="sect">Service interval</div><div class="small">Base ${a.schedule.base_service_interval_days} days → adjusted <b>${a.schedule.adjusted_service_interval_days} days</b><ul>${a.schedule.factors.map(f => `<li>${esc(f.factor)}${f.multiplier ? " ×" + f.multiplier : ""}${f.cap_days ? " (cap " + f.cap_days + " d)" : ""}</li>`).join("")}</ul></div>` : ""}
      <div class="sect">Inspection history</div><table><tr><th>Date</th><th>Phase</th><th>Score</th><th>Safety</th><th>Priority</th><th></th></tr>${hist}</table>
    </details>`);
  $("#mbody").querySelectorAll("[data-ins]").forEach(b => b.onclick = () => openInspection(b.dataset.ins));
  $("#mbody").querySelectorAll("[data-svc]").forEach(b => b.onclick = () => openService(b.dataset.svc));
}
async function openInspection(iid) {
  const i = await api("/api/kp/inspections/" + encodeURIComponent(iid));
  const h = i.health_score;
  modal(`<h2 style="margin-top:0">Inspection — ${fmtDate(i.inspected_at)} <span class="muted small">${esc(nice(i.phase))}</span></h2>
    <div class="row"><div>Health <b>${h.score}/100</b> ${badge(h.score_status)}</div><div>Safety ${badge(h.safety_status)}</div><div>Priority ${badge(h.repair_priority)}</div></div>
    ${i.safety_findings.map(f => `<div class="${f.level === "CRITICAL" ? "warn" : "attn"}" style="margin-top:8px"><b>${esc(nice(f.level))}</b>${esc(f.finding)} <span class="small muted">(${esc(nice(f.source))})</span></div>`).join("")}
    <div class="sect">Measurements (raw technician data)</div>
    <table><tr><th>Parameter</th><th>Value</th></tr>${i.measurements.map(m => `<tr><td>${esc(m.label)}${m.derived ? ' <span class="muted small">(calculated)</span>' : ""}</td><td>${esc(typeof m.value === "boolean" ? (m.value ? "Yes" : "No") : (typeof m.value === "string" ? nice(m.value) : m.value))} ${esc(m.unit || "")}</td></tr>`).join("")}</table>
    <div class="sect">Score components</div>
    <table>${h.components.map(c => `<tr><td>${esc(c.label)}</td><td>${c.points} / ${c.weight}</td></tr>`).join("")}</table>
    ${i.observations ? `<div class="sect">Technician observations</div><p>${esc(i.observations)}</p>` : ""}
    <div class="sect">Recommendations</div><ul>${i.recommendations.map(r => `<li>${esc(r.text)} <span class="muted small">— ${esc(r.technical_detail)}</span></li>`).join("")}</ul>
    <div class="photos" id="iph"></div>`);
  fillPhotos($("#iph"), i.photos);
}
async function openService(sid) {
  const s = await api("/api/kp/services/" + encodeURIComponent(sid));
  const c = s.comparison;
  modal(`<h2 style="margin-top:0">${esc(s.appliance_label)} — ${esc(nice(s.service_type))}</h2>
    <div class="small muted">${fmtDate(s.service_date)} · Technician: ${esc(s.technician?.name || "—")} · ${badge(s.status)}</div>
    ${c ? `<div class="card" style="margin-top:10px;background:var(--chip)"><div class="row" style="text-align:center"><div>Before<br><b style="font-size:26px">${c.before}</b>/100</div><div>After<br><b style="font-size:26px">${c.after}</b>/100</div><div>Improvement<br><b style="font-size:26px" class="${c.improvement >= 0 ? "up" : "down"}">${c.improvement >= 0 ? "+" : ""}${c.improvement}</b></div></div><p style="text-align:center;margin:8px 0 0"><b>${esc(c.message)}</b></p></div>` : ""}
    ${s.work_performed ? `<div class="sect">Work performed</div><p>${esc(s.work_performed)}</p>` : ""}
    ${s.technician_observations ? `<div class="sect">Technician observations</div><p>${esc(s.technician_observations)}</p>` : ""}
    <div class="sect">Parts replaced</div>${s.parts_replaced.length ? `<table><tr><th>Part</th><th>Qty</th><th>Price</th><th>Warranty until</th></tr>${s.parts_replaced.map(p => `<tr><td>${esc(p.part_name)}</td><td>${p.quantity}</td><td>₹${p.unit_price}</td><td>${fmtDate(p.warranty_until)}</td></tr>`).join("")}</table>` : '<p class="muted small">None</p>'}
    ${s.invoice ? `<div class="sect">Invoice</div><p class="small">Labour ₹${s.invoice.labour_amount} + Parts ₹${s.invoice.parts_amount} = <b>₹${s.invoice.total_amount}</b></p>` : ""}
    <div class="sect">Warranty</div><p class="small">${s.warranty.warranty_end ? "Appliance warranty until " + fmtDate(s.warranty.warranty_end) : "—"}${s.warranty.extended_warranty ? " (extended)" : ""}</p>
    <div class="sect">Photos</div><div class="photos" id="sph"></div>
    <div class="row" style="margin-top:10px">${s.before_inspection ? `<button class="ghost sm" data-ins="${esc(s.before_inspection.inspection_id)}">Before inspection</button>` : ""}${s.after_inspection ? `<button class="ghost sm" data-ins="${esc(s.after_inspection.inspection_id)}">After inspection</button>` : ""}

async function techScan(prefill) {
  const v = $("#view");
  v.innerHTML = `<div class="card"><h3 style="margin-top:0">Scan Kitchen Passport</h3><div class="row"><input id="code" placeholder="RC-KP-00000001 or scanned QR text" value="${esc(prefill || "")}"><button id="go" style="flex:0">Open</button><button id="cam" class="ghost" style="flex:0">Use camera</button></div>

    if (!("BarcodeDetector" in window)) { $("#se").textContent = "Camera scanning isn't supported in this browser — type the Passport ID instead."; return; }
    const det = new BarcodeDetector({formats: ["qr_code"]}); const vid = $("#vid");
    const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}}); vid.srcObject = stream; vid.classList.remove("hide"); await vid.play();
    const tick = async () => { const codes = await det.detect(vid).catch(() => []); if (codes.length) { stream.getTracks().forEach(t => t.stop()); vid.classList.add("hide"); $("#code").value = codes[0].rawValue; open(); } else if (!vid.classList.contains("hide")) requestAnimationFrame(tick); };
    tick();
  };
  if (prefill) open();
}

const STEPS = ["Scan", "Appliance", "Before inspection", "Before photos", "Service / repair", "After inspection", "After photos", "Parts & notes", "Results"];

function paramInput(p, val) {
  const id = "p_" + p.key; const req = p.required ? " *" : "";
  if (p.type === "enum") return `<div><label for="${id}">${esc(p.label)}${req}</label><select id="${id}" name="${esc(p.key)}"><option value="">—</option>${Object.keys(p.options).map(o => `<option value="${esc(o)}" ${val === o ? "selected" : ""}>${esc(nice(o))}</option>`).join("")}</select></div>`;
  if (p.type === "bool") return `<div><label for="${id}">${esc(p.label)}${req}</label><select id="${id}" name="${esc(p.key)}"><option value="">—</option><option value="false" ${val === false ? "selected" : ""}>No</option><option value="true" ${val === true ? "selected" : ""}>Yes</option></select></div>`;
  if (p.type === "number") return `<div><label for="${id}">${esc(p.label)}${p.unit ? " (" + esc(p.unit) + ")" : ""}${req}</label><input id="${id}" name="${esc(p.key)}" type="number" step="any" min="0" value="${val ?? ""}"></div>`;
  return `<div><label for="${id}">${esc(p.label)}</label><input id="${id}" name="${esc(p.key)}" value="${esc(val ?? "")}"></div>`;
}
function readParams(form, cat) {
  const out = {}; for (const p of cat.params) { const v = form.elements[p.key]?.value; if (v === undefined || v === "") continue;
    out[p.key] = p.type === "number" ? parseFloat(v) : p.type === "bool" ? v === "true" : v; } return out;
}
function evalSummary(ev) {

}
function wizard(W) {

  const inspForm = (phase, vals) => {

      <p class="small muted">Enter what you observe and measure. The Health Score, Safety Status, Repair Priority and Next Service Date are calculated automatically.</p>

      return {values: readParams(form, W.cat), technician_findings: tf, observations: form.elements.observations.value}; };
    form.oninput = () => { clearTimeout(timer); timer = setTimeout(async () => {
      let html; try { html = evalSummary(await api("/api/kp/tech/evaluate", {method: "POST", body: {appliance_id: W.a.appliance_id, ...body()}})); }
      catch (e) { html = esc(e.fields ? "Missing/invalid: " + Object.keys(e.fields).join(", ") : e.message); }

    form.onsubmit = async e => { e.preventDefault(); clearTimeout(timer); $("#ie").textContent = "";
      try { const b = body(); const res = await api(`/api/kp/tech/services/${encodeURIComponent(W.sid)}/inspections`, {method: "POST", body: {phase, ...b}});
        if (phase === "BEFORE") { W.before = res.evaluation; W.beforeVals = b.values; W.step = 3; } else { W.after = res.evaluation; W.step = 6; } wizard(W); }
      catch (err) { $("#ie").textContent = err.fields ? "Please fix: " + Object.entries(err.fields).map(([k, m]) => k + " " + m).join("; ") : err.message; } };
  };
  const photoStep = (kind, next) => {
    v.innerHTML = head + `<div class="card"><h3 style="margin-top:0">Upload ${kind.toLowerCase()} photos</h3><input type="file" id="ph" accept="image/jpeg,image/png,image/webp" multiple capture="environment">
      <div class="photos" id="phl"></div><p class="err" id="pe"></p><div class="row"><button id="nx">Continue</button></div></div>`;
    $("#ph").onchange = async e => { for (const f of e.target.files) { if (f.size > 2.9e6) { $("#pe").textContent = f.name + " is larger than 2.9 MB"; continue; }
      const b64 = await new Promise(res => { const rd = new FileReader(); rd.onload = () => res(String(rd.result).split(",")[1]); rd.readAsDataURL(f); });
      try { await api(`/api/kp/tech/services/${encodeURIComponent(W.sid)}/photos`, {method: "POST", body: {kind, mime_type: f.type, dataBase64: b64}});
        $("#phl").insertAdjacentHTML("beforeend", `<img src="${URL.createObjectURL(f)}" alt="">`); } catch (err) { $("#pe").textContent = err.message; } } };
    $("#nx").onclick = () => { W.step = next; wizard(W); };
  };
  if (W.step === 2) { v.innerHTML = head + inspForm("BEFORE", {}); bindInsp("BEFORE"); }
  else if (W.step === 3) photoStep("BEFORE", 4);
  else if (W.step === 4) {
    v.innerHTML = head + `<div class="card"><h3 style="margin-top:0">Before-service result</h3>${evalSummary(W.before)}
      <div class="sect">Recommended work</div><ol>${W.before.recommendations.items.map(i => `<li>${esc(i.text)} <span class="small muted">— ${esc(i.technical)}</span></li>`).join("")}</ol>
      <p>Perform the service / repair now, then record the after-service inspection.</p><button id="nx">Service done — record after inspection</button></div>`;
    $("#nx").onclick = () => { W.step = 5; wizard(W); };
  }
  else if (W.step === 5) { v.innerHTML = head + inspForm("AFTER", W.beforeVals); bindInsp("AFTER"); }
  else if (W.step === 6) photoStep("AFTER", 7);
  else if (W.step === 7) {
    v.innerHTML = head + `<div class="card"><h3 style="margin-top:0">Parts used & technician notes</h3>
      <table id="pt"><tr><th>Part</th><th>Qty</th><th>Unit price ₹</th><th>Warranty days</th><th></th></tr></table><button class="ghost sm" id="addp">+ Add part</button>
      <label>Work performed</label><textarea id="wp" rows="2"></textarea><label>Technician observations</label><textarea id="ob" rows="2"></textarea>
      <label>Labour charge ₹</label><input id="lab" type="number" min="0" value="0"><p class="err" id="ce"></p><button id="fin">Complete service & generate report</button></div>`;
    const addRow = () => $("#pt").insertAdjacentHTML("beforeend", `<tr><td><input class="pn"></td><td><input class="pq" type="number" min="1" value="1"></td><td><input class="pp" type="number" min="0" value="0"></td><td><input class="pw" type="number" min="0" value="0"></td><td><button class="sm ghost" onclick="this.closest('tr').remove()">×</button></td></tr>`);
    $("#addp").onclick = addRow;
    $("#fin").onclick = async () => { const parts = [...$("#pt").querySelectorAll("tr")].slice(1).map(tr => ({part_name: $(".pn", tr).value.trim(), quantity: parseInt($(".pq", tr).value, 10) || 1, unit_price: parseInt($(".pp", tr).value, 10) || 0, warranty_days: parseInt($(".pw", tr).value, 10) || 0})).filter(p => p.part_name);
      try { W.done = await api(`/api/kp/tech/services/${encodeURIComponent(W.sid)}/complete`, {method: "POST", body: {parts, work_performed: $("#wp").value, observations: $("#ob").value, labour_amount: parseInt($("#lab").value, 10) || 0}}); W.step = 8; wizard(W); }
      catch (err) { $("#ce").textContent = err.message; } };
  } else {
    const d = W.done, c = d.comparison;
    v.innerHTML = head + `<div class="card"><h3 style="margin-top:0">Service complete — Kitchen Health Report generated</h3>
      ${c ? `<p style="font-size:18px"><b>${esc(c.message)}</b> (${c.before} → ${c.after})</p>` : ""}${evalSummary(W.after)}
      <p class="small">Kitchen Health now <b>${d.kitchen_health.overall_score}/100</b> ${badge(d.kitchen_health.score_status)}. The customer has been notified and can approve the service in their app.</p>
      <button id="bk">Back to jobs</button></div>`;
    $("#bk").onclick = () => techApp();
  }
}

// ================================================================ admin
async function adminApp() {
  const tabs = ["Passports", "Jobs", "Technicians", "Configuration"];
  S.tab = S.tab && tabs.includes(S.tab) ? S.tab : "Passports";
  $("#app").innerHTML = `<nav class="tabs">${tabs.map(t => `<button class="${t === S.tab ? "on" : ""}">${t}</button>`).join("")}</nav><div id="view"></div>`;
  $("#app nav").onclick = e => { if (e.target.tagName === "BUTTON") { S.tab = e.target.textContent; adminApp(); } };
  const v = $("#view");
  if (S.tab === "Passports") {
    v.innerHTML = `<div class="card"><div class="row"><input id="q" placeholder="Search passport ID or name"><button id="qs" style="flex:0">Search</button></div><div id="pl"></div></div><div id="pv"></div>`;
    const load = async () => { const rows = await api("/api/kp/admin/passports?q=" + encodeURIComponent($("#q").value));
      $("#pl").innerHTML = `<table><tr><th>Passport</th><th>Customer</th><th>Kitchen</th><th>Health</th><th></th></tr>${rows.map(r => `<tr><td>${esc(r.passport_id)}</td><td>${esc(r.full_name)}</td><td>${esc(r.kitchen_name)}<div class="small muted">${esc(r.kitchen_id)}</div></td><td>${r.overall_health_score ?? "—"} ${badge(r.overall_score_status)}</td><td><button class="sm ghost" data-p="${esc(r.passport_id)}">Open</button> <button class="sm ghost" data-t="${esc(r.kitchen_id)}">Timeline</button></td></tr>`).join("")}</table>`;
      $("#pl").querySelectorAll("[data-p]").forEach(b => b.onclick = async () => showPassport(await api("/api/kp/admin/passports/" + encodeURIComponent(b.dataset.p)), $("#pv")));
      $("#pl").querySelectorAll("[data-t]").forEach(b => b.onclick = async () => { modal(timelineHTML(await api(`/api/kp/kitchens/${encodeURIComponent(b.dataset.t)}/timeline`))); bindTimeline($("#mbody")); }); };
    $("#qs").onclick = load; load();
  } else if (S.tab === "Jobs") {
    const [jobs, techs, pps] = await Promise.all([api("/api/kp/admin/jobs"), api("/api/kp/admin/technicians"), api("/api/kp/admin/passports")]);
    v.innerHTML = `<div class="card"><h3 style="margin-top:0">Assign a job</h3><form id="jf"><div class="pgrid">
      <div><label>Kitchen</label><select name="kitchen_id">${pps.map(p => `<option value="${esc(p.kitchen_id)}">${esc(p.passport_id)} — ${esc(p.full_name)} (${esc(p.kitchen_name)})</option>`).join("")}</select></div>
      <div><label>Technician</label><select name="technician_id">${techs.map(t => `<option value="${esc(t.id)}">${esc(t.name)}${t.kp_login_phone ? "" : " (no KP login)"}</option>`).join("")}</select></div>
      <div><label>Appliance ID (optional)</label><input name="appliance_id" placeholder="RC-DW-000001"></div>
      <div><label>Date</label><input type="date" name="scheduled_date"></div>
      <div><label>Type</label><select name="job_type"><option>SERVICE</option><option>REPAIR</option><option>INSPECTION</option><option>INSTALLATION</option></select></div>
      <div><label>Notes</label><input name="notes"></div></div><p class="err" id="je"></p><button>Assign</button></form></div>
      <div class="card"><table><tr><th>Job</th><th>Date</th><th>Customer</th><th>Technician</th><th>Type</th><th>Status</th></tr>${jobs.map(j => `<tr><td>${esc(j.job_id)}</td><td>${esc(j.scheduled_date)}</td><td>${esc(j.customer_name)}</td><td>${esc(j.technician_name)}</td><td>${esc(nice(j.job_type))}</td><td>${badge(j.status)}</td></tr>`).join("")}</table></div>`;
    $("#jf").onsubmit = async e => { e.preventDefault(); const body = {}; new FormData(e.target).forEach((val, k) => { if (val) body[k] = val; });
      try { await api("/api/kp/admin/jobs", {method: "POST", body}); adminApp(); } catch (err) { $("#je").textContent = err.message + " " + JSON.stringify(err.fields || ""); } };
  } else if (S.tab === "Technicians") {
    const techs = await api("/api/kp/admin/technicians");
    v.innerHTML = `<div class="card"><h3 style="margin-top:0">Technician Kitchen Passport logins</h3><p class="small muted">Owner only. Technicians using the Partner app can also sign in with their Firebase account.</p>
      <table><tr><th>Name</th><th>Category / area</th><th>Login phone</th><th>Set phone + PIN</th></tr>${techs.map(t => `<tr><td>${esc(t.name)}</td><td class="small">${esc(t.category)} · ${esc(t.area)}</td><td>${esc(t.kp_login_phone || "—")}</td>
      <td><div class="row"><input placeholder="Phone" data-ph="${esc(t.id)}"><input placeholder="PIN" type="password" data-pin="${esc(t.id)}"><button class="sm" style="flex:0" data-set="${esc(t.id)}">Save</button></div></td></tr>`).join("")}</table><p id="te" class="err"></p></div>`;
    v.querySelectorAll("[data-set]").forEach(b => b.onclick = async () => { const id = b.dataset.set;
      try { await api(`/api/kp/admin/technicians/${encodeURIComponent(id)}/pin`, {method: "POST", body: {phone: $(`[data-ph="${id}"]`).value, pin: $(`[data-pin="${id}"]`).value}}); adminApp(); } catch (err) { $("#te").textContent = err.message; } });
  } else {
    const {config: c, history} = await api("/api/kp/admin/config");
    const section = (key, title, val, note) => `<div class="card"><h3 style="margin-top:0">${title}</h3>${note ? `<p class="small muted">${note}</p>` : ""}<textarea rows="8" data-sec="${esc(key)}" style="font-family:ui-monospace,monospace;font-size:13px">${esc(JSON.stringify(val, null, 2))}</textarea>
      <div class="row" style="margin-top:6px"><button class="sm" style="flex:0" data-save="${esc(key)}">Save</button><button class="sm ghost" style="flex:0" data-reset="${esc(key)}">Reset to default</button><span class="small" data-msg="${esc(key)}"></span></div></div>`;
    v.innerHTML = `<div class="card"><b>Algorithm version ${c.algorithm_version}</b><p class="small muted">Every saved change creates a new algorithm version. Raw inspection data is never changed, so any inspection can be re-scored. Only the owner can save.</p>
      <table><tr><th>Version</th><th>Section</th><th>By</th><th>When</th></tr>${history.map(h => `<tr><td>${h.algorithm_version}</td><td>${esc(h.section)}</td><td>${esc(h.updated_by)}</td><td class="small">${esc(h.created_at)}</td></tr>`).join("")}</table></div>
      <div class="card"><h3 style="margin-top:0">Appliance score weights</h3><select id="wc">${Object.entries(c.categories).map(([k2, d]) => `<option value="${k2}">${esc(d.label)}</option>`).join("")}</select><div id="wt"></div></div>
      ${section("score_thresholds", "Score status thresholds", c.score_thresholds)}
      ${section("countdown_thresholds", "Service countdown thresholds", c.countdown_thresholds, "min = lowest days remaining for that status.")}
      ${section("kitchen_weights", "Kitchen score appliance weights", c.kitchen_weights)}
      ${section("service_intervals", "Service interval rules", c.service_intervals)}
      ${section("repair_priority", "Repair priority rules", c.repair_priority)}
      ${section("safety", "Global safety rules", c.safety, 'Per-category safety rules can be overridden via section "category:CODE".')}
      ${section("notifications", "Notification rules", c.notifications)}`;
    const showW = () => { const code = $("#wc").value; const cat = c.categories[code];
      $("#wt").innerHTML = `<table><tr><th>Component</th><th>Weight</th></tr>${cat.components.map(x => `<tr><td>${esc(x.label)}</td><td><input type="number" min="0" data-w="${esc(x.key)}" value="${x.weight}" style="max-width:100px"></td></tr>`).join("")}</table>
        <label>Base service interval (days)</label><input type="number" id="bsi" min="1" value="${cat.base_service_interval_days}" style="max-width:120px">
        <div class="row" style="margin-top:6px"><button class="sm" style="flex:0" id="ws">Save weights</button><button class="sm ghost" style="flex:0" id="wr">Reset category</button><span class="small" id="wm"></span></div>`;
      $("#ws").onclick = async () => { const weights = {}; $("#wt").querySelectorAll("[data-w]").forEach(i => weights[i.dataset.w] = parseFloat(i.value) || 0);
        try { const r = await api("/api/kp/admin/config/category:" + code, {method: "PUT", body: {value: {weights, base_service_interval_days: parseInt($("#bsi").value, 10)}}}); $("#wm").innerHTML = `<span class="ok">Saved — algorithm v${r.algorithm_version}</span>`; } catch (e) { $("#wm").innerHTML = `<span class="err">${esc(e.message)}</span>`; } };
      $("#wr").onclick = async () => { try { await api("/api/kp/admin/config/category:" + code, {method: "DELETE"}); adminApp(); } catch (e) { $("#wm").innerHTML = `<span class="err">${esc(e.message)}</span>`; } }; };
    $("#wc").onchange = showW; showW();
    v.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => { const k2 = b.dataset.save; const msg = $(`[data-msg="${k2}"]`);
      try { const val = JSON.parse($(`[data-sec="${k2}"]`).value); const r = await api("/api/kp/admin/config/" + k2, {method: "PUT", body: {value: val}}); msg.innerHTML = `<span class="ok">Saved — algorithm v${r.algorithm_version}</span>`; }
      catch (e) { msg.innerHTML = `<span class="err">${esc(e.message)}</span>`; } });
    v.querySelectorAll("[data-reset]").forEach(b => b.onclick = async () => { try { await api("/api/kp/admin/config/" + b.dataset.reset, {method: "DELETE"}); adminApp(); } catch (e) { $(`[data-msg="${b.dataset.reset}"]`).innerHTML = `<span class="err">${esc(e.message)}</span>`; } });
  }
}
render().catch(e => { $("#app").innerHTML = `<div class="card err">${esc(e.message)}</div>`; });
</script>
</body>
