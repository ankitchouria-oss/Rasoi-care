services:
  - type: web
    name: rasoicare-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Hostinger MySQL (hPanel -> Databases -> Remote MySQL for the host)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: STAFF_SEED_OWNER_PIN
        sync: false
      - key: STAFF_SEED_STAFF_PIN
        sync: false
