<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RasoiCare Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181C; --ink-soft:#4B5459; --text:#12181C;
    --paper:#F5F8F9; --card:#FFFFFF; --line:#DCE4E7; --stage-bg:#CDD6DA;
    --copper:#2E6F8E; --copper-deep:#1F4F66; --copper-tint:#DCEAF0;
    --emerald:#3E7C59; --emerald-tint:#E4EFE7;
    --amber:#B8912A; --amber-tint:#F5EAD1;
    --rust:#B5453D; --rust-tint:#F5E1DE;
    --display:'Instrument Serif', serif; --body:'Manrope', sans-serif; --mono:'JetBrains Mono', monospace;
  }
  :root[data-theme="dark"]{
    --text:#EAF2F5; --ink-soft:#93A3AA;
    --paper:#0A0F12; --card:#141C20; --line:#243035; --stage-bg:#05080A;
    --copper:#6FB8D9; --copper-deep:#9ED2EA; --copper-tint:rgba(111,184,217,0.16);
    --emerald:#5FCB8C; --emerald-tint:rgba(95,203,140,0.16);
    --amber:#E9C55C; --amber-tint:rgba(233,197,92,0.16);
    --rust:#E8887D; --rust-tint:rgba(232,136,125,0.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{ font-family:var(--body); color:var(--text); background:var(--stage-bg); min-height:100vh; }
  button, input, textarea{ font-family:inherit; }
  button{ cursor:pointer; border:none; background:none; }
  a{ text-decoration:none; color:inherit; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--copper-deep); outline-offset:2px; }

  /* ---- ops topbar ---- */
  .ops-topbar{ position:sticky; top:0; z-index:50; background:var(--ink); color:#fff; }
  .ops-topbar-inner{ max-width:1400px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:9px; font-family:var(--display); font-size:18px; flex:0 0 auto; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--copper); }
  .ops-status-toggle{ display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:10px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); font-size:11.5px; font-weight:700; }
  .ops-status-toggle .dot{ width:7px; height:7px; border-radius:50%; background:#67D394; flex:0 0 auto; }
  .ops-status-toggle.off .dot{ background:#8A867D; }
  .ops-chip{ display:flex; flex-direction:column; padding:6px 13px; border-radius:10px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); }
  .ops-chip .v{ font-family:var(--display); font-size:15px; font-weight:400; line-height:1.1; }
  .ops-chip .l{ font-family:var(--mono); font-size:8px; color:#B9C6CE; text-transform:uppercase; letter-spacing:0.04em; }
  .icon-btn{ width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .icon-btn:hover{ border-color:rgba(255,255,255,0.4); }
  .icon-btn.push{ margin-left:auto; }
  .dev-panel{ display:none; }
  .dev-panel.open{ display:block; }
  .ticker-row{ background:rgba(255,255,255,0.05); border-top:1px solid rgba(255,255,255,0.08); }
  .ticker{ max-width:1400px; margin:0 auto; padding:8px 24px; font-family:var(--mono); font-size:11px; color:#C9A876; display:flex; align-items:center; gap:8px; }
  .ticker .pulse{ width:6px; height:6px; border-radius:50%; background:#67D394; flex:0 0 auto; animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(103,211,148,.55);} 70%{box-shadow:0 0 0 6px rgba(103,211,148,0);} 100%{box-shadow:0 0 0 0 rgba(103,211,148,0);} }

  .connbar{ background:#0E1113; border-top:1px solid rgba(255,255,255,0.08); }
  .connbar-inner{ max-width:1400px; margin:0 auto; padding:9px 24px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .conn-dot{ width:8px; height:8px; border-radius:50%; background:var(--rust); flex:0 0 auto; }
  .conn-dot.ok{ background:#67D394; }
  .conn-label{ font-family:var(--mono); font-size:10.5px; color:#9C988F; }
  .conn-url{ font-family:var(--mono); font-size:11px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); color:#fff; padding:6px 10px; border-radius:8px; width:260px; }
  .conn-btn{ font-family:var(--mono); font-size:10.5px; font-weight:700; color:#fff; background:var(--copper); padding:6px 12px; border-radius:8px; }
  .conn-synced{ margin-left:auto; font-family:var(--mono); font-size:10px; color:#75726A; }
  .reset-btn{ font-family:var(--mono); font-size:10.5px; font-weight:700; color:#C9C6BF; border:1px solid rgba(255,255,255,0.2); padding:6px 12px; border-radius:9px; }
  .reset-btn:hover{ color:#fff; border-color:rgba(255,255,255,0.4); }

  /* ---- ops shell (list + persistent detail pane console) ---- */
  .ops-shell{ max-width:1400px; margin:0 auto; padding:20px 24px 60px; }
  .ops-tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .ops-tab{ padding:9px 16px; border-radius:10px; font-size:12.5px; font-weight:700; color:var(--ink-soft); background:var(--card); border:1.4px solid var(--line); display:flex; align-items:center; gap:7px; }
  .ops-tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .ops-tab .count{ font-family:var(--mono); font-size:9px; background:var(--rust); color:#fff; padding:1px 6px; border-radius:20px; }

  .ops-page{ display:none; }
  .ops-page.active{ display:block; }

  .ops-split{ display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start; }
  @media (max-width:860px){ .ops-split{ grid-template-columns:1fr; } }

  .ops-list-pane{ background:var(--card); border:1.4px solid var(--line); border-radius:16px; overflow:hidden; }
  .ops-list-head{ padding:11px 16px; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); border-bottom:1px solid var(--line); background:var(--paper); }
  .ops-list-body{ max-height:640px; overflow-y:auto; }
  .ops-row{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); width:100%; text-align:left; }
  .ops-row:last-child{ border-bottom:none; }
  .ops-row:hover{ background:var(--paper); }
  .ops-row.sel{ background:var(--copper-tint); }
  .ops-row .rtxt{ flex:1; min-width:0; }
  .ops-row .rtxt b{ font-size:12px; font-weight:800; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ops-row .rtxt span{ font-size:10px; color:var(--ink-soft); font-family:var(--mono); }
  .ops-row-empty{ padding:20px 16px; font-size:11.5px; color:var(--ink-soft); text-align:center; }

  .ops-detail-pane{ background:var(--card); border:1.4px solid var(--line); border-radius:16px; padding:22px; min-height:500px; }
  .ops-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:460px; color:var(--ink-soft); gap:10px; text-align:center; }
  .ops-empty .ic{ font-size:32px; opacity:0.5; }

  .ops-detail-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:12px; }
  .ops-detail-head h2{ font-family:var(--display); font-size:22px; font-weight:400; }
  .ops-detail-head .sub{ font-size:11px; color:var(--ink-soft); font-family:var(--mono); margin-top:2px; }
  .ops-detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:640px){ .ops-detail-grid{ grid-template-columns:1fr; } }
  .ops-col h3{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin:16px 0 8px; }
  .ops-col h3:first-child{ margin-top:0; }

  .btn{ display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13.5px; padding:12px 18px; border-radius:12px; width:100%; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:disabled{ opacity:0.45; }
  .btn-outline{ background:transparent; border:1.4px solid var(--text); color:var(--text); }
  .btn-sm{ padding:9px 14px; font-size:12px; border-radius:10px; width:auto; }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap; }
  .badge.emerald{ background:var(--emerald-tint); color:var(--emerald); }
  .badge.amber{ background:var(--amber-tint); color:var(--amber); }
  .badge.rust{ background:var(--rust-tint); color:var(--rust); }
  .badge.copper{ background:var(--copper-tint); color:var(--copper-deep); }

  .detail-row{ display:flex; gap:10px; font-size:11.5px; color:var(--ink-soft); padding:4px 0; }
  .detail-row b{ color:var(--text); font-weight:700; min-width:64px; }
  .map-ph{ height:110px; border-radius:14px; background:repeating-linear-gradient(135deg, var(--line), var(--line) 10px, var(--paper) 10px, var(--paper) 20px); border:1.4px solid var(--line); display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
  .map-ph .pin{ font-size:24px; }
  .photo-row{ display:flex; gap:10px; }
  .photo-slot{ flex:1; aspect-ratio:1; max-height:90px; border-radius:12px; border:1.6px dashed var(--line); background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:10.5px; color:var(--ink-soft); overflow:hidden; position:relative; cursor:pointer; }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
  .photo-slot input{ display:none; }
  .inv-line{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .inv-line input{ border:1.4px solid var(--line); background:var(--paper); color:var(--text); border-radius:9px; padding:8px 10px; font-size:11.5px; }
  .inv-line input.desc{ flex:1; }
  .inv-line input.amt{ width:72px; text-align:right; }
  .inv-total{ display:flex; justify-content:space-between; font-weight:800; font-size:13.5px; border-top:1.4px dashed var(--line); padding-top:10px; margin-top:4px; }
  .sig-pad{ border-radius:12px; border:1.4px solid var(--line); background:var(--paper); touch-action:none; width:100%; height:120px; display:block; }
  .sig-row{ display:flex; gap:8px; margin-top:8px; }
  .pay-toggle-row{ display:flex; gap:8px; margin-bottom:10px; }
  .pay-toggle{ flex:1; padding:10px; text-align:center; border-radius:11px; border:1.4px solid var(--line); background:var(--paper); font-size:12px; font-weight:700; }
  .pay-toggle.sel{ border-color:var(--copper); background:var(--copper-tint); color:var(--copper-deep); }
  .health-input{ width:100%; margin-bottom:8px; padding:9px 11px; border-radius:9px; border:1.4px solid var(--line); background:var(--paper); color:var(--text); font-size:12px; }

  .complaint-card{ margin-bottom:10px; border-radius:14px; border:1.4px solid var(--line); background:var(--card); padding:13px 14px; }
  .complaint-card .ctop{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; }
  .complaint-card b{ font-size:12px; font-weight:800; }
  .complaint-card .excerpt{ font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.4; }
  .mini-meter{ display:flex; gap:3px; margin-top:6px; }
  .mini-meter .dot{ width:6px; height:6px; border-radius:50%; background:var(--line); }
  .mini-meter .dot.on{ background:var(--rust); }
  .response-box{ margin-top:10px; width:100%; border-radius:11px; border:1.4px solid var(--line); background:var(--paper); padding:10px 12px; font-size:12px; color:var(--text); resize:none; min-height:60px; }
  .cbtn-row{ display:flex; gap:8px; margin-top:8px; }
  .complaints-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px; }

  .earn-hero-row{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:12px; margin-bottom:18px; }
  .earn-hero{ border-radius:16px; padding:18px; background:linear-gradient(155deg,#1B2023,var(--ink)); color:#fff; }
  .earn-hero .lbl{ font-family:var(--mono); font-size:9.5px; color:#C9C6BF; text-transform:uppercase; }
  .earn-hero .amt{ font-family:var(--display); font-size:26px; font-weight:400; margin-top:4px; }
  .earn-stat{ border-radius:16px; border:1.4px solid var(--line); background:var(--card); padding:16px; text-align:center; display:flex; flex-direction:column; justify-content:center; }
  .earn-stat .n{ font-family:var(--display); font-size:22px; font-weight:400; }
  .earn-stat .l{ font-size:9.5px; color:var(--ink-soft); font-weight:700; }
  .earn-list-panel{ background:var(--card); border:1.4px solid var(--line); border-radius:16px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; color:var(--ink-soft); font-weight:600; padding:9px 16px; border-bottom:1px solid var(--line); background:var(--paper); }
  td{ padding:10px 16px; border-bottom:1px solid var(--line); font-size:12px; }
  tr:last-child td{ border-bottom:none; }

  /* ---- real phone viewport ---- */
  @media (max-width:560px){
    .ops-topbar-inner{ padding:12px 14px; gap:8px; }
    .ops-chip{ padding:5px 10px; }
    .ops-shell{ padding:14px 12px 40px; }
    .ops-tab{ padding:9px 12px; font-size:12px; }
    .earn-hero-row{ grid-template-columns:1fr 1fr; }
    .ops-list-body{ max-height:280px; }
    .ops-detail-pane{ padding:16px; }
    .conn-url{ width:auto; flex:1; min-width:120px; }
  }
</style>
</head>
<body>

<div class="ops-topbar">
  <div class="ops-topbar-inner">
    <div class="brand"><span class="dot"></span>RasoiCare Partner</div>
    <button class="ops-status-toggle" id="online-toggle" onclick="toggleOnline()"><span class="dot"></span><span id="online-label">Online</span></button>
    <div class="ops-chip"><span class="v" id="chip-today">₹0</span><span class="l">Today</span></div>
    <div class="ops-chip"><span class="v" id="chip-jobs">0</span><span class="l">Jobs done</span></div>
    <button class="icon-btn push" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <button class="icon-btn" onclick="toggleDevPanel()" title="Developer options">⚙</button>
  </div>
  <div class="dev-panel" id="dev-panel">
    <div class="ticker-row">
      <div class="ticker"><span class="pulse"></span><span id="ticker-text">Ready.</span></div>
    </div>
    <div class="connbar">
      <div class="connbar-inner">
        <span class="conn-dot" id="conn-dot"></span>
        <span class="conn-label">API:</span>
        <input class="conn-url" id="conn-url-input" value="http://127.0.0.1:8420" spellcheck="false">
        <script>
          if (location.protocol.startsWith('http')) {
            document.getElementById('conn-url-input').value = location.origin;
          }
        </script>
        <button class="conn-btn" onclick="connectApi()">Connect</button>
        <button class="reset-btn" onclick="resetDemo()">↺ Reset data</button>
        <span class="conn-synced" id="conn-synced">not connected</span>
      </div>
    </div>
  </div>
</div>

<div class="ops-shell">
  <div class="ops-tabs">
    <button class="ops-tab active" data-tab="jobs" onclick="opsGo('jobs')">📋 Jobs</button>
    <button class="ops-tab" data-tab="earnings" onclick="opsGo('earnings')">₹ Earnings</button>
    <button class="ops-tab" data-tab="complaints" onclick="opsGo('complaints')">⚑ Complaints <span class="count" id="ops-complaint-count">0</span></button>
  </div>

  <div class="ops-page active" id="ops-jobs">
    <div class="ops-split">
      <div class="ops-list-pane">
        <div class="ops-list-head">New requests</div>
        <div class="ops-list-body" id="ops-new-list"></div>
        <div class="ops-list-head">Active jobs</div>
        <div class="ops-list-body" id="ops-active-list"></div>
        <div class="ops-list-head">Completed</div>
        <div class="ops-list-body" id="ops-completed-list"></div>
      </div>
      <div class="ops-detail-pane" id="ops-detail-pane">
        <div class="ops-empty"><span class="ic">🔧</span><span>Select a job from the list to view details.</span></div>
      </div>
    </div>
  </div>

  <div class="ops-page" id="ops-earnings">
    <div class="earn-hero-row">
      <div class="earn-hero"><div class="lbl">Total collected</div><div class="amt" id="earn-total">₹0</div></div>
      <div class="earn-stat"><div class="n" id="earn-today">₹0</div><div class="l">TODAY</div></div>
      <div class="earn-stat"><div class="n" id="earn-jobs">0</div><div class="l">JOBS DONE</div></div>
      <div class="earn-stat"><div class="n" id="earn-rating">—</div><div class="l">RATING</div></div>
    </div>
    <div class="earn-list-panel">
      <table><thead><tr><th>Order</th><th>Service</th><th>Amount</th><th>Date</th></tr></thead><tbody id="earn-list"></tbody></table>
    </div>
  </div>

  <div class="ops-page" id="ops-complaints">
    <div class="complaints-grid" id="tech-complaints-content"></div>
  </div>
</div>

<script>
  function applyStoredTheme(){
    if(localStorage.getItem('rc_theme') === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
    updateThemeUI();
  }
  function toggleTheme(){
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); localStorage.setItem('rc_theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('rc_theme','dark'); }
    updateThemeUI();
  }
  function updateThemeUI(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    const btn = document.getElementById('theme-btn'); if(btn) btn.textContent = dark ? '☀' : '🌙';
  }
  function toggleDevPanel(){ document.getElementById('dev-panel').classList.toggle('open'); }
  applyStoredTheme();

  let isOnline = true;
  function toggleOnline(){
    isOnline = !isOnline;
    document.getElementById('online-toggle').classList.toggle('off', !isOnline);
    document.getElementById('online-label').textContent = isOnline ? 'Online' : 'Offline';
    log(isOnline ? '🟢 You are online — new jobs will be assigned to you.' : '⚪ You are offline — no new jobs will arrive.');
  }

  let API_BASE = document.getElementById('conn-url-input').value.trim();
  let STATE = { bookings:[], complaints:[], connected:false };
  let pollTimer = null;

  async function apiGet(path){
    const r = await fetch(API_BASE + path);
    if(!r.ok) throw new Error('GET ' + path + ' failed: ' + r.status);
    return r.json();
  }
  async function apiPost(path, body){
    const r = await fetch(API_BASE + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
    if(!r.ok) throw new Error('POST ' + path + ' failed: ' + r.status);
    return r.json();
  }
  async function apiPatch(path, body){
    const r = await fetch(API_BASE + path, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
    if(!r.ok) throw new Error('PATCH ' + path + ' failed: ' + r.status);
    return r.json();
  }

  function setConnStatus(ok, label){
    document.getElementById('conn-dot').classList.toggle('ok', ok);
    document.getElementById('conn-synced').textContent = label;
  }

  async function connectApi(){
    API_BASE = document.getElementById('conn-url-input').value.trim().replace(/\/$/, '');
    setConnStatus(false, 'connecting…');
    try{
      await apiGet('/api/health');
      STATE.connected = true;
      setConnStatus(true, 'connected — polling every 4s');
      log('🔗 Connected to ' + API_BASE);
      if(pollTimer) clearInterval(pollTimer);
      await refreshAll();
      pollTimer = setInterval(refreshAll, 4000);
    } catch(err){
      STATE.connected = false;
      setConnStatus(false, 'unreachable — check the URL / that the server is running');
      log('⚠️ Could not reach ' + API_BASE + '. Is the backend running and CORS-reachable from this page?');
    }
  }

  async function refreshAll(){
    try{
      const [bookings, complaints] = await Promise.all([apiGet('/api/bookings'), apiGet('/api/complaints')]);
      STATE.bookings = bookings; STATE.complaints = complaints;
      STATE.connected = true;
      setConnStatus(true, 'last synced ' + new Date().toLocaleTimeString());
      render();
    } catch(err){
      STATE.connected = false;
      setConnStatus(false, 'lost connection — retrying…');
    }
  }

  function log(msg){ document.getElementById('ticker-text').textContent = msg; }

  const STATUS_ORDER = ['Requested','Accepted','On the way','In Progress','Completed'];
  const TABS = ['jobs','earnings','complaints'];

  function findBooking(id){ return STATE.bookings.find(b => b.id === id); }

  function opsGo(id){
    document.querySelectorAll('.ops-page').forEach(p => p.classList.remove('active'));
    document.getElementById('ops-' + id).classList.add('active');
    document.querySelectorAll('.ops-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
    if(id === 'jobs') renderTechJobs();
    if(id === 'earnings') renderEarnings();
    if(id === 'complaints') renderTechComplaints();
  }

  async function techAdvance(bookingId){
    const b = await apiPatch('/api/bookings/' + bookingId + '/advance', {});
    log('🔧 Ramesh moved #' + b.id + ' to "' + b.status + '"');
    await refreshAll();
    if(currentDetailId === bookingId) openJobDetail(bookingId);
  }

  async function techResolve(complaintId, responseText){
    await apiPatch('/api/complaints/' + complaintId, { response: responseText || 'Resolved by technician.', status:'Resolved' });
    log('✅ Ramesh resolved ' + complaintId);
    await refreshAll();
  }

  async function resetDemo(){
    if(!STATE.connected){ log('⚠️ Not connected — hit Connect first.'); return; }
    await apiPost('/api/reset', {});
    log('↺ Server data reset to seed state.');
    currentDetailId = null;
    opsGo('jobs');
    await refreshAll();
  }

  function miniMeter(n){
    let d = '';
    for(let i=1;i<=5;i++) d += '<span class="dot' + (i<=n?' on':'') + '"></span>';
    return '<div class="mini-meter">' + d + '</div>';
  }

  function render(){
    const done = STATE.bookings.filter(b => b.status === 'Completed');
    const todayStr = new Date().toDateString();
    const today = done.filter(b => new Date(b.createdAt).toDateString() === todayStr).reduce((s,b) => s + b.price, 0);
    document.getElementById('chip-today').textContent = '₹' + today;
    document.getElementById('chip-jobs').textContent = done.length;
    document.getElementById('ops-complaint-count').textContent = STATE.complaints.filter(c => c.status !== 'Resolved').length;

    if(document.getElementById('ops-jobs').classList.contains('active')) renderTechJobs();
    if(document.getElementById('ops-earnings').classList.contains('active')) renderEarnings();
    if(document.getElementById('ops-complaints').classList.contains('active')) renderTechComplaints();
    if(currentDetailId) refreshDetailSummary();
  }

  function renderTechJobs(){
    const reqs = STATE.bookings.filter(b => b.status === 'Requested');
    const active = STATE.bookings.filter(b => !['Requested','Completed'].includes(b.status));
    const done = STATE.bookings.filter(b => b.status === 'Completed');

    document.getElementById('ops-new-list').innerHTML = reqs.length ? reqs.map(b =>
      '<button class="ops-row' + (b.id===currentDetailId?' sel':'') + '" onclick="openJobDetail(\'' + b.id + '\')">' +
      '<span class="rtxt"><b>' + b.category + ' · ' + b.service + '</b><span>#' + b.id + '</span></span>' +
      '<span class="badge copper">₹' + b.price + '</span></button>'
    ).join('') : '<div class="ops-row-empty">No new requests right now.</div>';

    document.getElementById('ops-active-list').innerHTML = active.length ? active.map(b =>
      '<button class="ops-row' + (b.id===currentDetailId?' sel':'') + '" onclick="openJobDetail(\'' + b.id + '\')">' +
      '<span class="rtxt"><b>' + b.category + ' · ' + b.service + '</b><span>#' + b.id + '</span></span>' +
      '<span class="badge amber">' + b.status + '</span></button>'
    ).join('') : '<div class="ops-row-empty">Nothing in progress.</div>';

    document.getElementById('ops-completed-list').innerHTML = done.length ? done.map(b =>
      '<button class="ops-row' + (b.id===currentDetailId?' sel':'') + '" onclick="openJobDetail(\'' + b.id + '\')">' +
      '<span class="rtxt"><b>' + b.category + ' · ' + b.service + '</b><span>#' + b.id + '</span></span>' +
      '<span class="badge emerald">✓</span></button>'
    ).join('') : '<div class="ops-row-empty">No completed jobs yet.</div>';
  }

  function renderTechComplaints(){
    const box = document.getElementById('tech-complaints-content');
    if(!STATE.complaints.length){ box.innerHTML = '<div class="ops-row-empty">No complaints. 🎉</div>'; return; }
    box.innerHTML = STATE.complaints.map(c => {
      const b = findBooking(c.bookingId);
      return '<div class="complaint-card"><div class="ctop"><b>Order #' + c.bookingId + '</b><span class="badge ' + (c.status==='New'?'rust':c.status==='Resolved'?'emerald':'amber') + '">' + c.status + '</span></div>' +
        (b && b.ratings ? miniMeter(b.ratings.tech) : '') +
        '<p class="excerpt">"' + c.text + '"</p>' +
        (c.status !== 'Resolved' ?
          '<textarea class="response-box" id="resp-' + c.id + '" placeholder="Explain what happened and how you\'ll resolve it...">' + (c.response||'') + '</textarea>' +
          '<div class="cbtn-row"><button class="btn btn-primary btn-sm" onclick="techResolve(\'' + c.id + '\', document.getElementById(\'resp-' + c.id + '\').value)">Submit &amp; resolve</button></div>'
          : '<p class="excerpt" style="margin-top:8px;"><b>Response:</b> ' + c.response + '</p>') +
        '</div>';
    }).join('');
  }

  /* ---------------- job detail (renders into the persistent right pane) ---------------- */
  let currentDetailId = null;
  let invoiceLines = [];
  let signatureSaved = false;
  let collectMethod = 'cash';
  let jobPhotos = {};

  function openJobDetail(id){
    currentDetailId = id;
    jobPhotos = {}; signatureSaved = false; collectMethod = 'cash';
    const b = findBooking(id);
    if(!b) return;
    invoiceLines = [
      { desc: b.service + ' (labor)', amt: Math.round(b.price * 0.7) },
      { desc: 'Parts & consumables', amt: b.price - Math.round(b.price * 0.7) }
    ];
    renderDetailPane(b);
    renderTechJobs();
  }

  function renderDetailPane(b){
    const pane = document.getElementById('ops-detail-pane');
    pane.innerHTML =
      '<div class="ops-detail-head"><div><h2>Order #' + b.id + '</h2><div class="sub">' + b.category + ' · ' + b.service + '</div></div>' +
      '<span class="badge ' + (b.status==='Completed'?'emerald':b.status==='Requested'?'copper':'amber') + '" id="detail-status-badge">' + b.status + '</span></div>' +
      '<div class="ops-detail-grid">' +
        '<div class="ops-col">' +
          '<h3>Job</h3>' +
          '<div class="detail-card">' +
            '<div class="detail-row"><b>Amount</b><span id="detail-amount">₹' + b.price + '</span></div>' +
            '<div class="detail-row"><b>Booked</b><span>' + new Date(b.createdAt).toLocaleString() + '</span></div>' +
          '</div>' +
          '<h3>Customer</h3>' +
          '<div class="detail-card">' +
            '<div class="detail-row"><b>Name</b><span>Amit Sharma</span></div>' +
            '<div class="detail-row"><b>Address</b><span>221B, MG Road, Baner, Pune 411045</span></div>' +
            '<div class="detail-row"><b>Phone</b><span>+91 98XXXXXX21</span></div>' +
          '</div>' +
          '<div class="map-ph"><span class="pin">📍</span></div>' +
          '<button class="btn btn-outline btn-sm" onclick="log(\'🗺️ Opening navigation…\')">Navigate to customer</button>' +
          '<h3>Job photos</h3>' +
          '<div class="photo-row">' +
            '<label class="photo-slot" id="photo-before"><span>📷 Before</span><input type="file" accept="image/*" onchange="handlePhoto(this,\'before\')"></label>' +
            '<label class="photo-slot" id="photo-after"><span>📷 After</span><input type="file" accept="image/*" onchange="handlePhoto(this,\'after\')"></label>' +
          '</div>' +
        '</div>' +
        '<div class="ops-col">' +
          '<h3>Invoice</h3>' +
          '<div class="detail-card" id="invoice-builder"></div>' +
          '<h3>Customer signature</h3>' +
          '<canvas class="sig-pad" id="sig-pad" width="320" height="120"></canvas>' +
          '<div class="sig-row">' +
            '<button class="btn btn-outline btn-sm" onclick="clearSignature()">Clear</button>' +
            '<button class="btn btn-primary btn-sm" onclick="saveSignature()" style="flex:1;">Save signature</button>' +
          '</div>' +
          '<p id="sig-status" style="font-size:10.5px;color:var(--ink-soft);margin-top:6px;"></p>' +
          '<h3>Collect payment</h3>' +
          '<div class="pay-toggle-row">' +
            '<button class="pay-toggle sel" id="paytog-cash" onclick="pickCollectMethod(\'cash\')">Cash</button>' +
            '<button class="pay-toggle" id="paytog-upi" onclick="pickCollectMethod(\'upi\')">UPI</button>' +
          '</div>' +
          '<button class="btn btn-primary" id="collect-btn" onclick="collectPayment()" style="margin-bottom:16px;">Mark payment collected</button>' +
          '<h3>Log kitchen health</h3>' +
          '<div id="health-log-wrap" style="margin-bottom:16px;"></div>' +
          '<div id="detail-advance-wrap"></div>' +
        '</div>' +
      '</div>';
    renderInvoiceBuilder();
    initSignaturePad();
    document.getElementById('paytog-cash').classList.add('sel');
    document.getElementById('paytog-upi').classList.remove('sel');
    refreshDetailSummary();
  }

  function refreshDetailSummary(){
    const b = findBooking(currentDetailId);
    if(!b || !document.getElementById('detail-status-badge')) return;
    const badge = document.getElementById('detail-status-badge');
    badge.className = 'badge ' + (b.status==='Completed'?'emerald':b.status==='Requested'?'copper':'amber');
    badge.textContent = b.status;
    document.getElementById('detail-amount').textContent = '₹' + b.price;

    const idx = STATUS_ORDER.indexOf(b.status);
    const wrap = document.getElementById('detail-advance-wrap');
    wrap.innerHTML = idx < STATUS_ORDER.length - 1
      ? '<button class="btn btn-primary" onclick="techAdvance(\'' + b.id + '\')">Move to \'' + STATUS_ORDER[idx+1] + '\'</button>'
      : '<p style="font-size:11.5px;color:var(--ink-soft);text-align:center;">This job is complete.</p>';

    const collectBtn = document.getElementById('collect-btn');
    collectBtn.disabled = b.status !== 'Completed';
    collectBtn.textContent = b.price === 0 ? 'No payment due' : (b.status === 'Completed' ? 'Mark payment collected' : 'Available once completed');
    if(b.price === 0) collectBtn.disabled = true;

    renderHealthLog(b);
  }

  const HEALTH_METRIC_SUGGESTIONS = {
    RasoiAir:'Filter Saturation', RasoiSpark:'Gas Pressure', RasoiBuilt:'Seal Condition',
    RasoiWash:'Drain Efficiency', RasoiChill:'Cooling Efficiency', RasoiPure:'Filter Life'
  };
  function renderHealthLog(b){
    const wrap = document.getElementById('health-log-wrap');
    if(b.status !== 'Completed'){
      wrap.innerHTML = '<p style="font-size:11px;color:var(--ink-soft);">Available once the job is marked completed.</p>';
      return;
    }
    const suggestion = HEALTH_METRIC_SUGGESTIONS[b.category] || 'Condition';
    wrap.innerHTML =
      '<input id="health-metric" class="health-input" value="' + suggestion + '" placeholder="Metric name">' +
      '<input id="health-value" type="range" min="0" max="100" value="80" style="width:100%;" oninput="document.getElementById(\'health-value-lbl\').textContent = this.value + \'%\'">' +
      '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin:2px 0 8px;"><span>0%</span><span id="health-value-lbl">80%</span><span>100%</span></div>' +
      '<input id="health-status" class="health-input" value="Optimal" placeholder="Status label (e.g. Optimal, Needs attention)">' +
      '<button class="btn btn-primary btn-sm" style="width:100%;" onclick="saveHealthLog(\'' + b.id + '\')">Save health reading</button>' +
      '<p id="health-log-status" style="font-size:10.5px;color:var(--ink-soft);margin-top:6px;"></p>';
  }
  async function saveHealthLog(bookingId){
    const metric_name = document.getElementById('health-metric').value.trim();
    const value_pct = Number(document.getElementById('health-value').value);
    const status_label = document.getElementById('health-status').value.trim();
    const statusEl = document.getElementById('health-log-status');
    if(!metric_name || !status_label){ statusEl.textContent = 'Fill in both fields.'; return; }
    try{
      await apiPost('/api/bookings/' + bookingId + '/health-update', { metric_name, value_pct, status_label });
      statusEl.textContent = '✅ Saved · ' + new Date().toLocaleTimeString();
      log('🩺 Logged ' + metric_name + ' (' + value_pct + '%) for #' + bookingId);
    } catch(e){
      statusEl.textContent = '⚠️ Could not save — check the connection.';
    }
  }

  function handlePhoto(input, slot){
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      jobPhotos[slot] = e.target.result;
      document.getElementById('photo-' + slot).innerHTML = '<img src="' + e.target.result + '">' +
        '<input type="file" accept="image/*" onchange="handlePhoto(this,\'' + slot + '\')">';
    };
    reader.readAsDataURL(file);
  }

  function renderInvoiceBuilder(){
    const box = document.getElementById('invoice-builder');
    const total = invoiceLines.reduce((s,l) => s + (Number(l.amt) || 0), 0);
    box.innerHTML = invoiceLines.map((l,i) =>
      '<div class="inv-line"><input class="desc" value="' + l.desc + '" oninput="invoiceLines[' + i + '].desc=this.value">' +
      '<input class="amt" type="number" value="' + l.amt + '" oninput="invoiceLines[' + i + '].amt=this.value; renderInvoiceBuilder();"></div>'
    ).join('') +
    '<button class="btn btn-outline btn-sm" style="width:auto;margin-bottom:10px;" onclick="invoiceLines.push({desc:\'New item\',amt:0}); renderInvoiceBuilder();">+ Add line</button>' +
    '<div class="inv-total"><span>Total</span><span>₹' + total + '</span></div>';
  }

  let sigCtx = null, sigDrawing = false;
  function initSignaturePad(){
    const canvas = document.getElementById('sig-pad');
    if(!canvas) return;
    sigCtx = canvas.getContext('2d');
    sigCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text') || '#12181C';
    sigCtx.lineWidth = 2;
    sigCtx.lineCap = 'round';
    const pos = e => {
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: (p.clientX - rect.left) * (canvas.width/rect.width), y: (p.clientY - rect.top) * (canvas.height/rect.height) };
    };
    const start = e => { sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); };
    const move = e => { if(!sigDrawing) return; const p = pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); e.preventDefault(); };
    const end = () => { sigDrawing = false; };
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:true});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
  }
  function clearSignature(){
    if(!sigCtx) return;
    sigCtx.clearRect(0,0,320,120);
    signatureSaved = false;
    document.getElementById('sig-status').textContent = '';
  }
  function saveSignature(){
    signatureSaved = true;
    document.getElementById('sig-status').textContent = '✅ Signature captured · ' + new Date().toLocaleTimeString();
  }

  function pickCollectMethod(m){
    collectMethod = m;
    document.getElementById('paytog-cash').classList.toggle('sel', m === 'cash');
    document.getElementById('paytog-upi').classList.toggle('sel', m === 'upi');
  }
  function collectPayment(){
    log('💰 Collected ₹' + (findBooking(currentDetailId)?.price || 0) + ' via ' + collectMethod.toUpperCase() + ' for #' + currentDetailId);
    document.getElementById('collect-btn').textContent = 'Payment collected ✓';
    document.getElementById('collect-btn').disabled = true;
  }

  /* ---------------- earnings ---------------- */
  function renderEarnings(){
    const done = STATE.bookings.filter(b => b.status === 'Completed');
    const total = done.reduce((s,b) => s + b.price, 0);
    const todayStr = new Date().toDateString();
    const today = done.filter(b => new Date(b.createdAt).toDateString() === todayStr).reduce((s,b) => s + b.price, 0);
    const ratings = done.filter(b => b.ratings).map(b => b.ratings.tech);
    const avgRating = ratings.length ? (ratings.reduce((a,c)=>a+c,0)/ratings.length).toFixed(1) : '—';

    document.getElementById('earn-total').textContent = '₹' + total;
    document.getElementById('earn-today').textContent = '₹' + today;
    document.getElementById('earn-jobs').textContent = done.length;
    document.getElementById('earn-rating').textContent = avgRating === '—' ? '—' : avgRating + '★';

    document.getElementById('earn-list').innerHTML = done.length ? done.map(b =>
      '<tr><td><b>#' + b.id + '</b></td><td>' + b.category + ' · ' + b.service + '</td><td>₹' + b.price + '</td><td style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);">' + new Date(b.createdAt).toLocaleDateString() + '</td></tr>'
    ).join('') : '<tr><td colspan="4" style="color:var(--ink-soft);">No completed jobs yet.</td></tr>';
  }

  render();
  connectApi();
</script>
